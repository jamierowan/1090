<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1090.games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Single color background covering the entire browser height */
    body {
      background-color: #b5b5b5; /* #5059FF; */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    /* Centered container */
    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: left;
    }

    /* Custom Banner Image */
    .banner-img {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 2px;
    }

    /* Description */
    .description {
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Games Header */
    h2.section-header {
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* Game Links List */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .game-link {
      display: inline;
      padding: 16px 24px;
      /*background-color: #1e293b;*/
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      border-radius: 8px;
      border: 1px solid #334155;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .game-link:hover {
      background-color: #334155;
      color: #ffffff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo_1080p.png" alt="1090.games Banner" class="banner-img">

    <!-- Small Description -->
    <p class="description">
      Games designed by Jamie Rowan.
    </p>

    <!-- Games Section Header -->
    <h2 class="section-header">Games</h2>

    <!-- Game Links -->
    <div class="games-list">
      <a href="https://store.steampowered.com/app/3131340/Lelu/" class="game-link" target="_blank">Lelu</a>
    </div>
  </div>

</body>
</html>
