<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1090.games</title>
  <style>
    /* Solid single-color background covering the whole page */
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #b5b5b5;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      box-sizing: border-box;
    }

    /* Logo image styling */
    .logo {
      max-width: 256px;
      width: 100%;
      height: auto;
      margin-bottom: 16px;
    }

    /* Description text */
    .description {
      font-size: 1rem;
      color: #000000;
      max-width: 400px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Section header */
    h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    /* Game links list */
    .game-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 256px;
    }

    .game-card {
      display: block;
      padding: 16px 16px;
      background-color: #000000;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 2px;
      border: 1px solid #000000;
      transition: background-color 0.2s, transform 0.2s;
    }

    .game-card:hover {
      background-color: #5059FF;
      color: #ffffff;
      /*transform: translateY(-2px);*/
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Replace logo.png with your uploaded logo filename -->
    <img src="logo_1080p.png" alt="1090.games Logo" class="logo">

    <!-- Short description -->
    <p class="description">Welcome.</p>

    <!-- Header -->
    <!--<h2>Games</h2> -->

    <!-- Game links -->
    <div class="game-links">

      <a href="https://store.steampowered.com/app/3131340/Lelu/" class="game-card" target="_blank">Lelu</a>

    </div>
  </div>

</body>
</html>
