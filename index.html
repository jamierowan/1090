<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; color: #333; text-align: center; }
    
    .banner {
      background-color: #1f2937;
      color: #ffffff;
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #111827; }
    p.subtitle { color: #6b7280; margin-bottom: 30px; font-size: 1rem; }

    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn {
      display: block;
      padding: 14px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .link-btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <div class="banner">
    Welcome to My Official Site
  </div>

  <div class="container">
    <h1>My Website Header</h1>
    <p class="subtitle">Connect with me across the web:</p>

    <div class="links">
      <a href="https://example.com" class="link-btn" target="_blank">First Link</a>
      <a href="https://example.com" class="link-btn" target="_blank">Second Link</a>
      <a href="https://example.com" class="link-btn" target="_blank">Third Link</a>
    </div>
  </div>

</body>
</html>
